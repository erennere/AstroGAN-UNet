[pytest]
testpaths = tests
addopts = --strict-markers -v
filterwarnings =
    ignore:.*found in sys\.modules after import of package.*prior to execution.*:RuntimeWarning
    ignore:__array__ implementation doesn't accept a copy keyword.*:DeprecationWarning
    ignore:Skipping variable loading for optimizer.*:UserWarning
    ignore:The 'xcentroid' attribute was deprecated.*:Warning
    ignore:The 'ycentroid' attribute was deprecated.*:Warning
    ignore:FigureCanvasAgg is non-interactive, and thus cannot be shown:UserWarning
    ignore:Mean of empty slice:RuntimeWarning
    ignore:invalid value encountered in scalar divide:RuntimeWarning
    ignore:`model\.compiled_loss\(\)` is deprecated.*:UserWarning
markers =
    unit: fast unit tests for isolated Python logic
    integration: tests that combine multiple project components
    slow: tests that may take longer than typical unit tests
