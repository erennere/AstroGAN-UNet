# Local profile: every job runs on this machine, one at a time (each job uses its own threads,
# see dataset.workers and train.loader_workers).
cores: 1
keep-going: true          # a failed run does not stop the others; start again to retry it
rerun-incomplete: true    # jobs cut off by a stop or crash are run again (training resumes)
rerun-triggers: [mtime, input]   # input: a summary reruns when its set of runs changes (grid edited mid-study)
latency-wait: 5
