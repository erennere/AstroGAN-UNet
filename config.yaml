# Keys marked null are resolved at runtime from the section noted in the comment.
# To override a shared key for a specific script, replace null with the desired value.
# CLI overrides always take precedence over config-owned or imported values.
# Never use fallback/default patterns in code - missing keys must raise immediately.

paths:
  data_dir: "../data"
  training_path: "{data_dir}/training_images"
  eval_path: "{data_dir}/eval_images"
  test_path: "{data_dir}/test_images"
  metadata_csv: "{data_dir}/downloaded_metadata_{data_alias_enriched_hex}.csv"
  fit_info_csv: "{data_dir}/fit_info_{data_alias_enriched_hex}.csv"
  models_dir: "../models"
  plots_dir: "../plots"
  multimodal_metrics_dir: "../metrics/multi_modal"
  singlemodal_metrics_dir: "../metrics/single_modal"

mast:
  mission: hst
  main_column: sci_actual_duration
  filters:
    sci_spec_1234: F160W,F160W;*,*;F160W,*;F160W;*
    sci_obs_type: image
    sci_aec: S
    sci_instrume: wfc3
  metadata_output: null  # resolved from 'paths.metadata_csv' at runtime
  id_column: sci_data_set_name
  url_column: drz_URL
  save_dir: "{data_dir}/originals"
  max_requests: 10000
  reset_after: 15
  max_workers: 16
  chunk_size: 500
  resolve_max_retries: 2
  resolve_retry_delay: 2.0
  prefer_token: drz
  download: false
  fetch_metadata: true
  resolve_urls: true

create_dataset:
  dataset: null  # resolved from 'mast.id_column' at runtime
  exposure_col: null  # resolved from 'mast.main_column' at runtime
  metadata_filepath: null  # resolved from 'mast.metadata_output' at runtime
  split_dirs: null  # resolved from 'paths.training_path, paths.eval_path, and paths.test_path' at runtime
  dataset_dir: null  # resolved from 'paths.data_dir' at runtime
  id_column: null  # resolved from 'mast.id_column' at runtime
  exp_column: null  # resolved from 'mast.main_column' at runtime
  url_column: null  # resolved from 'mast.url_column' at runtime
  reset_after: null  # resolved from 'mast.reset_after' at runtime
  max_requests: null  # resolved from 'mast.max_requests' at runtime
  type_of_image: SCI
  ps: 256
  nan_value: 0.0
  posinf_value: 0.0
  neginf_value: 0.0
  location_col: location
  survey_column: sci_aper_1234
  allowed_survey: [IR, IR-FIX, IR-UVIS-CENTER, IR-UVIS-FIX, GRISM1024, IR-UVIS, G141-REF, G102-REF]
  filter_surveys: true
  filter_by_last_name: false
  last_name_filter_value: ['FABER']
  last_name_col: sci_pi_last_name
  file_extension: .fits
  originals_subdir: originals
  masked_images_dirname: masked_images
  filtered_metadata_output_file: "{data_dir}/filtered_metadata_{data_alias_enriched_hex}.csv"
  noisy_filtered_metadata_output_file: "{data_dir}/metadata_filepath_enriched_with_noise_{data_alias_enriched_hex}.csv"
  cropped_stats_output_file: "{data_dir}/cropped_images_stats_{data_alias_enriched_hex}.csv"
  url_filename_split_token: '%2F'
  crop_name_separator: _
  crop_prefix_parts: 1
  original_filename_suffix: _drz.fits
  temp_index_column: temp_index
  max_iterations: 1
  filename_column: filename
  original_filename_column: original_filename
  masked_filename_prefix: masked_
  original_stats_prefix: org_
  stats_column_map:
    mean_bkg: mean_bkg
    median_bkg: median_bkg
    std_bkg: std_bkg
    max_bkg: max_bkg
    mean_src: mean_src
    median_src: median_src
    std_src: std_src
    max_src: max_src
    abs_mean: abs_mean
    abs_median: abs_median
  stats_column_tokens: [mean, median, std, max]
  download: true
  cropping: true
  stats_on_crops: true
  save: false
  size: 3000
  low: 200
  high: 20000
  seed: 42
  split: [60, 20, 20]
  sigma: 3
  nsigma: 2
  npixels: 8
  footprint_radius: 10
  maxiters: 10
  bkg_box_size: 64
  exclude_percentile: 15.0
  max_workers: 16
  step: 5

new_train:
  data:
    dataset: null  # resolved from 'create_dataset.dataset' at runtime
    exposure_col: null  # resolved from 'create_dataset.exposure_col' at runtime
    type_of_image: null  # resolved from 'create_dataset.type_of_image' at runtime
    ps: null  # resolved from 'create_dataset.ps' at runtime
    nan_value: null  # resolved from 'create_dataset.nan_value' at runtime
    posinf_value: null  # resolved from 'create_dataset.posinf_value' at runtime
    neginf_value: null  # resolved from 'create_dataset.neginf_value' at runtime
    location_col: null  # resolved from 'create_dataset.location_col' at runtime
    training_path: null  # resolved from 'paths.training_path' at runtime
    eval_path: null  # resolved from 'paths.eval_path' at runtime
    test_path: null  # resolved from 'paths.test_path' at runtime
    fit_data_filepath: null  # resolved from 'paths.fit_info_csv' at runtime
    metadata_filepath: null  # resolved from 'create_dataset.cropped_stats_output_file' at runtime
    stats_column_map: null  # resolved from 'create_dataset.stats_column_map' at runtime
    original_stats_prefix: null  # resolved from 'create_dataset.original_stats_prefix' at runtime
    checkpoint_custom_epoch: null  # resolved from 'new_train.training.checkpoint_custom_epoch' at runtime
    checkpoint_restore_kwargs: null  # resolved from 'new_train.training.checkpoint_restore_kwargs' at runtime
    steps: 100
    dk: 7
    ron: 3
    save: false
    sv_name: null
    path: null
    start: 2
    stop: 6
    name_col: filename
    sigma_key: diff_sigma
    low: 60
    high: 20000
    samples: 30000
    val_samples: 100
    test_samples: 100
    times: 2
    training: true
    test: false
    ratio_initial: 2
    ratio_count: 10
    ratio_growth: 1.5
    lowest_power: -4
    highest_power: 4
    n_samples_per_magnitude: 3
    delta: 0.3
    candidates_fn: exposure_ratio
    post_filter_fn: default
    sample_fn: exposure_ratio_v2
    occurrences_per_col_D: 4
    quantiles: [20, 40, 60, 80, 100]
    percentages: [20, 20, 20, 20, 20]
    min_exp_ratio: 1.5
    max_exp_ratio: 100.0
    min_exp_time: 60
    cache_raw_metadata: true
    sub_sample_train: null
    sub_sample_eval: null
    sigma_kernel_fn: row
    noise_fn: _simulated_image_from_exposure
    min_value: 0.000000000001
    stats_name_fn: exposure
    training_cache_filepath: "{models_dir}/sampled_training_{model_alias_hex}.csv"
    eval_cache_filepath: "{models_dir}/sampled_eval_{model_alias_hex}.csv"
    test_cache_filepath: "{models_dir}/sampled_test_{model_alias_hex}.csv"
    info_filepath: "{models_dir}/info_{model_alias_hex}.csv"
    results_path: "{models_dir}/checkpoints"
    max_workers: 8
  network:
    depth: 5
    kernel_size: 3
    filter_size: 2
    pooling_size: 2
    n_of_initial_channels: 64
    func: LeakyReLU
    batch_normalization: true
    dropout_rate: 0.2
    func_kwargs: {}
    use_bias: false
    block_depth: 2
    dropout_from_layer: 1
    attention: true
    output_activation: null
    kernel_initializer: he_normal
  discriminator:
    depth: 2
    n_initial_filters: 64
    filter_size: 2
    kernel_size: [3, 3]
    dropout_rate: 0.2
    func: LeakyReLU
    func_kwargs: {}
    output_activation: sigmoid
    block_depth: 2
    batch_normalization: true
    use_bias: false
    dropout_from_layer: 1
  gan:
    d_learning_rate: 0.0002
    loss_fn: BinaryCrossentropy
    adversarial_loss_weight: 1.0
    reconstruction_loss_weight: 100.0
    label_smoothing: 0.05
  training:
    n_epochs: 60
    batch_size: 64
    use_gan: true
    optimizer: Adam
    patch_size: null  # resolved from 'create_dataset.ps' at runtime
    learning_rate: 0.0002
    beta_1: 0.5
    g_loss_fn: log_cosh_loss
    change_learning_rate:
      - [0, 0.0002]
      - [40, 0.0001]
      - [80, 0.00005]
    start_from_best: true
    start_from_last: false
    save_freq: 10
    eval_save_percentage: 10
    ds_save_percentage: 0.1
    scaling: z_scale
    data_generator: data_augment_pluggable
    training_results_dir: null  # resolved from 'paths.models_dir' at runtime
    validation_loss_filename: validation_loss_{model_alias_hex}.txt
    training_metrics_filename: training_metrics_{model_alias_hex}.txt
    training_metrics_csv_path: "{models_dir}/training_history_{model_alias_hex}.csv"
    training_history_json_path: "{models_dir}/training_history_{model_alias_hex}.json"
    checkpoint_filename_pattern: "{prefix}_{epoch}.keras"
    checkpoint_custom_epoch: null
    checkpoint_restore_kwargs:
      filename_pattern: "{prefix}_{epoch}.keras"

metrics:
  models_dir: null  # resolved from 'new_train.training.training_results_dir' at runtime
  metadata_filepath: null  # resolved from 'create_dataset.cropped_stats_output_file' at runtime
  type_of_image: null  # resolved from 'create_dataset.type_of_image' at runtime
  batch_size: null  # resolved from 'new_train.training.batch_size' at runtime
  scaling: null  # resolved from 'new_train.training.scaling' at runtime
  patch_size: null  # resolved from 'create_dataset.ps' at runtime
  sigma: null  # resolved from 'create_dataset.sigma' at runtime
  nsigma: null  # resolved from 'create_dataset.nsigma' at runtime
  npixels: null  # resolved from 'create_dataset.npixels' at runtime
  footprint_radius: null  # resolved from 'create_dataset.footprint_radius' at runtime
  maxiters: null  # resolved from 'create_dataset.maxiters' at runtime
  hist_min_exp: null  # resolved from 'new_train.data.lowest_power' at runtime
  hist_max_exp: null  # resolved from 'new_train.data.highest_power' at runtime
  model_prototype: null  # resolved from 'new_train.training.checkpoint_filename_pattern' at runtime
  all_metrics_csv: "{multimodal_metrics_dir}/{data_alias_enriched_hex}/all_metrics_*.csv"
  aggregated_metrics_csv: "{multimodal_metrics_dir}/{data_alias_enriched_hex}/aggregated_metrics_*.csv"
  org_catalog_csv: "{multimodal_metrics_dir}/{data_alias_enriched_hex}/org_catalog_*.csv"
  noisy_catalog_csv: "{multimodal_metrics_dir}/{data_alias_enriched_hex}/noisy_catalog_*.csv"
  rec_catalog_csv: "{multimodal_metrics_dir}/{data_alias_enriched_hex}/rec_catalog_*.csv"
  parallel: true
  parallel_epoch: false
  total_workers: 36
  max_workers: 6
  frac: 0.20
  n: 50
  stride: [64, 64, 1]
  weighting: average
  gaussian_sigma: 64
  use_custom_test_images: false
  new_exp_time_col: new_exp_time
  deblend: false
  deblend_timeout: 30
  nlevels: 32
  contrast: 0.001
  distance_threshold: 5
  alpha: 1
  beta: 1
  gamma: 1
  k1: 0.01
  k2: 0.03
  win_size: 11
  win_sigma: 1.5
  func: wrap_extract_sources
  thresh: 2.25
  org_thresh: 2.0
  radius_factor: 6.0
  PHOT_FLUXFRAC: 0.5
  r_min: 1.75
  elongation_fraction: 1.5
  PHOT_AUTOPARAMS: 2.5
  maskthresh: 0.0
  minarea: 8
  org_minarea: 6
  filter_type: matched
  deblend_nthresh: 32
  deblend_cont: 0.005
  clean: true
  clean_param: 1.0
  combined_images_dir: "{multimodal_metrics_dir}/{data_alias_enriched_hex}/*/combined_images"
  png_dir: "{multimodal_metrics_dir}/{data_alias_enriched_hex}/*/pngs"
  org_dir: "{multimodal_metrics_dir}/{data_alias_enriched_hex}/*/original_images"
  noisy_dir: "{multimodal_metrics_dir}/{data_alias_enriched_hex}/*/noisy_images"
  rec_dir: "{multimodal_metrics_dir}/{data_alias_enriched_hex}/*/reconstructed_images"
  use_mosaic: false

uncropped_metrics:
  models_dir: null  # resolved from 'new_train.training.training_results_dir' at runtime
  metadata_filepath: null  # resolved from 'create_dataset.cropped_stats_output_file' at runtime
  model_prototype: null  # resolved from 'new_train.training.checkpoint_filename_pattern' at runtime
  hist_min_exp: null  # resolved from 'new_train.data.lowest_power' at runtime
  hist_max_exp: null  # resolved from 'new_train.data.highest_power' at runtime
  kwargs_source: null  # resolved from 'metrics.kwargs_source' at runtime
  data_kwargs: null  # resolved from 'metrics.data_kwargs' at runtime
  uncropped_patch_size: null  # resolved from 'create_dataset.ps' at runtime
  uncropped_stride: null  # resolved from 'metrics.stride' at runtime
  uncropped_weighting: null  # resolved from 'metrics.weighting' at runtime
  uncropped_use_mosaic: false
  uncropped_save_images: true
  uncropped_output_dir: "{singlemodal_metrics_dir}/{data_alias_enriched_hex}/{model_alias_hex}"
  uncropped_combined_images_dir: "{singlemodal_metrics_dir}/{data_alias_enriched_hex}/{model_alias_hex}/combined_images"
  uncropped_sampled_data_csv: "{singlemodal_metrics_dir}/{data_alias_enriched_hex}/{model_alias_hex}/sampled_data.csv"
  uncropped_n: 2000
  uncropped_workers: 16
  uncropped_results_csv: results_metrics_{model_alias_hex}.csv
  uncropped_org_catalog_csv: org_catalog_{model_alias_hex}.csv
  uncropped_noisy_catalog_csv: noise_catalog_{model_alias_hex}.csv
  uncropped_rec_catalog_csv: rec_catalog_{model_alias_hex}.csv
  uncropped_hist_data_csv: hist_data_{model_alias_hex}.csv
  uncropped_hist_png_template: hist_{model_alias_hex}_{exp_ratio}.png
  uncropped_batch_size: 1

merge_catalogs:
  uncropped_output_dir: null  # resolved from 'uncropped_metrics.uncropped_output_dir' at runtime
  uncropped_rec_catalog_csv: null  # resolved from 'uncropped_metrics.uncropped_rec_catalog_csv' at runtime
  uncropped_noisy_catalog_csv: null  # resolved from 'uncropped_metrics.uncropped_noisy_catalog_csv' at runtime
  uncropped_org_catalog_csv: null  # resolved from 'uncropped_metrics.uncropped_org_catalog_csv' at runtime
  photometrical_data_filename: photometrical_data_{model_alias_hex}.parquet
  merge_catalog_workers: 16
  merge_catalog_threshold: 3.0

prepare_images:
  low: null  # resolved from 'new_train.data.low' at runtime
  metadata_filepath: null  # resolved from 'mast.metadata_output' at runtime
  dataset: null  # resolved from 'create_dataset.dataset' at runtime
  ps: null  # resolved from 'create_dataset.ps' at runtime
  exp_column: null  # resolved from 'create_dataset.exposure_col' at runtime
  type_of_image: null  # resolved from 'create_dataset.type_of_image' at runtime
  model_dir: null  # resolved from 'new_train.training.training_results_dir' at runtime
  model_prototype: null  # resolved from 'new_train.training.checkpoint_filename_pattern' at runtime
  scaling: null  # resolved from 'new_train.training.scaling' at runtime
  kwargs_source: null  # resolved from 'metrics.kwargs_source' at runtime
  data_kwargs: null  # resolved from 'new_train.data' at runtime
  output_dir: "{plots_dir}/{data_alias_enriched_hex}/{model_alias_hex}/sources"
  sample_n: 100
  ratio_initial: 2
  ratio_count: 8
  ratio_growth: 1.5
  targ_col: sci_targname

prepare_plots:
  metadata_filepath: null  # resolved from 'create_dataset.cropped_stats_output_file' at runtime
  uncropped_output_dir: null  # resolved from 'uncropped_metrics.uncropped_output_dir' at runtime
  photometrical_data_filename: null  # resolved from 'merge_catalogs.photometrical_data_filename' at runtime
  uncropped_results_csv: null  # resolved from 'uncropped_metrics.uncropped_results_csv' at runtime
  output_dir: "{plots_dir}/{data_alias_enriched_hex}/{model_alias_hex}/plots"
  rec_cmap: viridis
  noise_cmap: cividis
  norm_quantiles: [1, 99]
