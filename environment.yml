name: astro-unets
channels:
  - conda-forge
  - defaults
dependencies:
  # Minimal conda base
  - python=3.11
  - pip>=23

  - pip:
    # Python packages installed via pip (bundled CUDA + cuDNN)
    - tensorflow[and-cuda]==2.20.0
    - tensorboard==2.20.0
    - tensorflow-io-gcs-filesystem>=0.37.1

    # Core data science
    - numpy>=1.24
    - pandas>=2.0
    - scipy>=1.10
    - scikit-learn>=1.3
    - scikit-image>=0.21

    # Astronomy
    - astropy>=6.0
    - photutils>=3.0
    - regions>=0.11
    - astroquery>=0.4.11
    - sep>=1.4.1

    # Async/HTTP
    - aiohttp>=3.13.5
    - aiodns>=4.0.0

    # Image processing
    - Pillow>=10.0
    - opencv-python>=4.8

    # Visualization
    - matplotlib>=3.7
    - plotly>=5.17

    # System/IO
    - h5py>=3.9
    - PyYAML>=6.0

    # Build/utilities
    - setuptools>=68
    - wheel>=0.40

    # Development
    - ipython>=8.15
    - jupyter>=1.0
    - pytest>=7.4
